# Fly.io configuration for the Inventory Engine demo deploy.
# See https://fly.io/docs/reference/configuration/ for the full schema.

app = "inventory-engine-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Non-secret defaults. APP_KEY, APP_URL, and anything sensitive are set via
  # `fly secrets set` so they are not baked into the image.

[[mounts]]
  source = "engine_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1

[deploy]
  strategy = "immediate"
